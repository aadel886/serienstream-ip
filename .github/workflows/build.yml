name: Build and publish Cloudstream repo

on:
  push:
    branches: [main, master]
    paths: [Source.zip, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudstream-builds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source
        run: unzip -q Source.zip -d source
      - uses: actions/cache@v4
        with:
          path: source/.build-cache
          key: cloudstream-deps-${{ hashFiles('source/dependencies.json') }}
      - name: Compile, test and package
        working-directory: source
        run: python tools/build.py
      - name: Publish installation files
        env:
          SOURCE_REPO: ${{ github.repository }}
        run: |
          publish_dir="$RUNNER_TEMP/serienstream-publish"
          mkdir -p "$publish_dir"
          git -C "$publish_dir" init
          cd "$publish_dir"
          git remote add origin "https://github.com/$SOURCE_REPO.git"
          auth_header="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)"
          git config http.https://github.com/.extraheader "$auth_header"
          if git fetch origin builds; then
            git checkout -B builds FETCH_HEAD
          else
            git checkout --orphan builds
          fi
          cp "$GITHUB_WORKSPACE"/source/dist/SerienStreamIP.cs3 .
          cp "$GITHUB_WORKSPACE"/source/dist/plugins.json .
          cp "$GITHUB_WORKSPACE"/source/dist/repo.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SerienStreamIP.cs3 plugins.json repo.json
          if ! git diff --cached --quiet; then
            git commit -m "Build SerienStream IP"
            git push origin HEAD:builds
          fi
          printf 'Repo URL: https://raw.githubusercontent.com/%s/builds/repo.json\n' "$SOURCE_REPO" >> "$GITHUB_STEP_SUMMARY"
